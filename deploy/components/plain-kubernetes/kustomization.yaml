apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: Deployment
    name: kubevirt-csi-controller
  patch: |-
    kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: kubevirt-csi-controller
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
